<!DOCTYPE html>
<html lang="nl" data-thema="donker">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111823">
<title>Babytracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/stijl.css">
</head>
<body>

<div class="foutstrook" id="foutstrook" role="alert" hidden></div>

<div class="inlogscherm" id="inlogscherm" hidden>
  <form class="inlogkaart" id="inlogformulier">
    <h1>Babytracker</h1>
    <div class="veldlabel">E-mailadres</div>
    <input type="email" id="email" autocomplete="username" required>
    <div class="veldlabel">Wachtwoord</div>
    <input type="password" id="wachtwoord" autocomplete="current-password" required>
    <button class="knop vol" type="submit" id="inlogknop">Inloggen</button>
    <div class="inlogfout" id="inlogfout" role="alert" hidden></div>
  </form>
</div>

<div class="wrap" id="app" hidden>

  <header>
    <h1 id="naam">Emily</h1>
    <div class="kopmeta">
      <div class="leeftijd" id="leeftijd"></div>
      <button class="themaknop" id="themaknop" onclick="themaWissel()" aria-label="Licht of donker"></button>
      <button class="themaknop" id="uitlogknop" aria-label="Uitloggen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 17v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v2"/>
          <path d="M19 12H9M16 9l3 3-3 3"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="tellers" id="tellers"></div>

  <div class="acties">
    <button class="actie" style="--kleur:var(--voeding)" onclick="opdracht('voeding')">
      <span class="punt"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v3l-3 4v11h10V10l-3-4V3"/><path d="M9 13h6M9 17h6"/></svg></span>
      <span>Voeding</span>
    </button>
    <button class="actie" style="--kleur:var(--luier)" onclick="opdracht('luier')">
      <span class="punt"><svg viewBox="0 0 24 24"><path d="M3 6h18v4a11 11 0 0 1-9 10 11 11 0 0 1-9-10z"/><path d="M8 14h8"/></svg></span>
      <span>Luier</span>
    </button>
    <div class="actie metmeer" id="slaapknop" style="--kleur:var(--slaap)">
      <button class="actiehoofd" onclick="slaapWissel()">
        <span class="punt"><svg viewBox="0 0 24 24"><path d="M20 14a8 8 0 0 1-10.6-10.4A8.2 8.2 0 1 0 20 14z"/></svg></span>
        <span id="slaaptekst">Slaap</span>
      </button>
      <button class="actiemeer" onclick="opdracht('slaap')" aria-label="Slaap achteraf invoeren">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <button class="actie" style="--kleur:var(--kolven)" onclick="opdracht('kolven')">
      <span class="punt"><svg viewBox="0 0 24 24"><path d="M8 3h8l-2 5h3v13H7V8h3z"/><path d="M7 13h10"/></svg></span>
      <span>Kolven</span>
    </button>
  </div>

  <nav role="tablist">
    <button role="tab" aria-selected="true" onclick="naarTab('vandaag')">Vandaag</button>
    <button role="tab" aria-selected="false" onclick="naarTab('historie')">Historie</button>
    <button role="tab" aria-selected="false" onclick="naarTab('groei')">Groei</button>
  </nav>

  <div id="inhoud"></div>

  <footer>
    Alles wordt bewaard in de database en is meteen zichtbaar op de andere telefoon.
  </footer>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)sluit()">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
